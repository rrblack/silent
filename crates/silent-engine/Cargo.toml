[package]
name = "silent-engine"
description = "Rooms, pairwise key exchange and WebRTC mesh for Silent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
silent-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
tracing.workspace = true
libwebrtc = "=0.3.52"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-native"] }

[dev-dependencies]
silent-relay.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing-subscriber.workspace = true

[build-dependencies]
pkg-config = "0.3"
