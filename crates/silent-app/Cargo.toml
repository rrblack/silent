[package]
name = "silent-app"
description = "Silent desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "silent"
path = "src/main.rs"

[dependencies]
silent-core.workspace = true
silent-engine.workspace = true
silent-relay.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1.18"
