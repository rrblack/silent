name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, core + relay tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p silent-core -p silent-relay
      - run: cargo clippy -p silent-core -p silent-relay --all-targets -- -D warnings

  worker:
    name: Cloudflare Worker typecheck + protocol tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Relay protocol tests against wrangler dev
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/healthz && break; sleep 1; done
          SILENT_TEST_RELAY=http://127.0.0.1:8787 cargo test -p silent-relay -- --test-threads=1

  build:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # libwebrtc's macOS bindings need a recent libc++ (they are built with Xcode 26).
      - name: Newest Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode
        if: runner.os == 'macOS'
        run: xcodebuild -version

      - name: Linux dependencies (clang 21 for libwebrtc, UI, capture, audio)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 lld-21 libglib2.0-dev libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libwayland-dev libv4l-dev libpulse-dev libasound2-dev libgbm-dev libdrm-dev \
            libxcb1-dev libxrandr-dev libxdamage-dev libxfixes-dev libxcomposite-dev libxext-dev libxtst-dev \
            libpipewire-0.3-dev libgl-dev
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - name: Engine end-to-end call tests
        if: runner.os == 'Linux'
        run: cargo test -p silent-engine

      - name: Build app
        env:
          # Relay baked into the app; set it under Settings → Secrets and variables → Actions → Variables.
          SILENT_RELAY_URL: ${{ vars.SILENT_RELAY_URL }}
        run: cargo build --release -p silent-app

      - uses: actions/upload-artifact@v4
        with:
          name: silent-${{ runner.os }}
          path: |
            target/release/silent
            target/release/silent.exe
            target/release/silent-relay
            target/release/silent-relay.exe
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Rust engine, Kotlin bindings, libwebrtc.jar
        run: android/build-native.sh
      - name: APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon "-PsilentRelayUrl=${{ vars.SILENT_RELAY_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: silent-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
