[workspace]
resolver = "2"
members = ["crates/silent-core", "crates/silent-relay", "crates/silent-engine", "crates/silent-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/rrblack/silent"
rust-version = "1.85"

[workspace.dependencies]
silent-core = { path = "crates/silent-core" }
silent-relay = { path = "crates/silent-relay" }
silent-engine = { path = "crates/silent-engine" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = "0.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
